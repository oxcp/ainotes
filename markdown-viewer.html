    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <style>
        :root { color-scheme: light; --ink: #1f2328; --muted: #59636e; --border: #d1d9e0; --link: #0969da; --surface: #ffffff; --canvas: #f6f8fa; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: var(--canvas); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
        .toolbar { position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--border); background: rgba(255, 255, 255, .96); }
        .toolbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; width: 100%; padding: .75rem 1.25rem; }
        .back { color: var(--link); text-decoration: none; font-weight: 600; }
        .path { overflow: hidden; color: var(--muted); font-size: .875rem; text-overflow: ellipsis; white-space: nowrap; }
        .page-shell { max-width: 980px; min-height: calc(100vh - 58px); margin: 0 auto; background: var(--surface); }
        .sidebar-view .page-shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); width: 100%; max-width: none; }
        .toc-view .page-shell { display: grid; grid-template-columns: minmax(0, 1fr) 240px; width: 100%; max-width: none; }
        .sidebar-view.toc-view .page-shell { grid-template-columns: 240px minmax(0, 1fr) 260px; }
        .sidebar-view.toc-view .sidebar { grid-column: 1; grid-row: 1; }
        .toc-view main.markdown-body { grid-column: 1; grid-row: 1; }
        .toc-view .table-of-contents { grid-column: 2; grid-row: 1; }
        .sidebar-view.toc-view main.markdown-body { grid-column: 2; }
        .sidebar-view.toc-view .table-of-contents { grid-column: 3; }
        .sidebar { position: sticky; top: 58px; align-self: start; height: calc(100vh - 58px); padding: 1.5rem 1rem; overflow-y: auto; background: var(--canvas); border-right: 1px solid var(--border); }
        .sidebar-title { margin: 0 0 .75rem; padding: 0 .65rem; color: var(--muted); font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
        .language-switch { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem; margin: 0 .65rem 1rem; padding: .2rem; background: #eaeef2; border-radius: 7px; }
        .language-option { padding: .3rem .5rem; color: var(--muted); font-size: .8125rem; font-weight: 600; text-align: center; text-decoration: none; border-radius: 5px; }
        .language-option:hover { color: var(--ink); background: rgba(255, 255, 255, .65); }
        .language-option[aria-current="true"] { color: var(--ink); background: var(--surface); box-shadow: 0 1px 2px rgba(31, 35, 40, .12); }
        .sidebar-links { display: grid; gap: .25rem; }
        .sidebar-link { display: flex; align-items: center; gap: .6rem; min-height: 2.25rem; padding: .45rem .65rem; color: var(--ink); font-size: .875rem; line-height: 1.3; text-decoration: none; border-radius: 6px; }
        .sidebar-link:hover { background: #eaeef2; }
        .sidebar-link[aria-current="page"] { color: var(--link); font-weight: 600; background: #ddf4ff; }
        .sidebar-link svg { flex: 0 0 auto; width: 1rem; height: 1rem; color: var(--muted); }
        .sidebar-link[aria-current="page"] svg { color: var(--link); }
        .sidebar-group { min-width: 0; }
        .sidebar-group > summary { cursor: pointer; list-style: none; }
        .sidebar-group > summary::-webkit-details-marker { display: none; }
        .sidebar-group > summary::before { content: '\25b8'; }
        .sidebar-group[open] > summary::before { content: '\25be'; }
        .sidebar-group-links { display: grid; gap: .25rem; margin-left: .75rem; padding-left: .5rem; border-left: 1px solid var(--border); }
        .sidebar-divider { margin: .75rem .65rem; border: 0; border-top: 1px solid var(--border); }
        .table-of-contents { position: sticky; top: 58px; align-self: start; height: calc(100vh - 58px); padding: 1.5rem 1rem; overflow-y: auto; background: var(--canvas); border-left: 1px solid var(--border); }
        .toc-title { margin: 0 0 .75rem; color: var(--muted); font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
        .toc-links { display: grid; gap: .15rem; }
        .toc-link { display: block; padding: .35rem .5rem; overflow-wrap: anywhere; color: var(--muted); font-size: .8125rem; line-height: 1.35; text-decoration: none; border-left: 2px solid transparent; border-radius: 0 4px 4px 0; }
        .toc-link:hover { color: var(--ink); background: #eaeef2; }
        .toc-link:focus-visible, .sidebar-link:focus-visible, .language-option:focus-visible, .back:focus-visible, .heading-anchor:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
        .toc-link[aria-current="location"] { color: var(--link); font-weight: 600; border-left-color: var(--link); background: #ddf4ff; }
        .toc-level-2 { padding-left: 1rem; }
        .toc-level-3 { padding-left: 1.5rem; }
        .toc-level-4, .toc-level-5, .toc-level-6 { padding-left: 2rem; }
        main.markdown-body { width: 100%; min-width: 0; min-height: calc(100vh - 58px); margin: 0; padding: 2.5rem 2rem 4rem; color: var(--ink); background: var(--surface); }
        .markdown-body [id] { scroll-margin-top: 76px; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 { text-wrap: balance; }
        .markdown-body pre { position: relative; padding-top: 2.75rem; }
        .markdown-body pre code.hljs { padding: 0; background: transparent; }
        .markdown-body .heading-anchor { margin-left: -1.2em; padding-right: .3em; color: var(--muted); text-decoration: none; opacity: 0; }
        .markdown-body h1:hover .heading-anchor,
        .markdown-body h2:hover .heading-anchor,
        .markdown-body h3:hover .heading-anchor,
        .markdown-body h4:hover .heading-anchor,
        .markdown-body h5:hover .heading-anchor,
        .markdown-body h6:hover .heading-anchor { opacity: 1; }
        .copy-code { position: absolute; top: .5rem; right: .5rem; display: inline-grid; width: 2rem; height: 2rem; padding: 0; place-items: center; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
        .copy-code:hover { color: var(--ink); background: var(--canvas); }
        .copy-code svg { width: 1rem; height: 1rem; }
        .mermaid-diagram { margin: 1.5rem 0; overflow-x: auto; text-align: center; }
        .mermaid-diagram svg { display: block; width: auto; max-width: 100%; height: auto; margin: 0 auto; }
        .mermaid-error { padding: 1rem; color: #cf222e; text-align: left; white-space: pre-wrap; background: #ffebe9; border: 1px solid #ff8182; border-radius: 6px; }
        .markdown-body video { display: block; width: min(100%, 900px); max-height: 70vh; margin: 1rem 0; background: #000; border-radius: 6px; }
        .markdown-alert { margin: 1rem 0; padding: .5rem 1rem; color: inherit; border-left: .25rem solid var(--border); }
        .markdown-alert-title { display: flex; align-items: center; gap: .4rem; margin: 0 0 .35rem; font-weight: 600; }
        .markdown-alert-title svg { width: 1rem; height: 1rem; }
        .markdown-alert-note { border-left-color: #0969da; }
        .markdown-alert-note .markdown-alert-title { color: #0969da; }
        .markdown-alert-tip { border-left-color: #1a7f37; }
        .markdown-alert-tip .markdown-alert-title { color: #1a7f37; }
        .markdown-alert-important { border-left-color: #8250df; }
        .markdown-alert-important .markdown-alert-title { color: #8250df; }
        .markdown-alert-warning { border-left-color: #9a6700; }
        .markdown-alert-warning .markdown-alert-title { color: #9a6700; }
        .markdown-alert-caution { border-left-color: #cf222e; }
        .markdown-alert-caution .markdown-alert-title { color: #cf222e; }
        .markdown-body .task-list-item { list-style: none; }
        .markdown-body .task-list-item input { margin: 0 .45em 0 -1.4em; vertical-align: middle; }
        .status { color: var(--muted); }
        .error { color: #cf222e; }
        @media (max-width: 1100px) {
            .toc-view .page-shell,
            .sidebar-view.toc-view .page-shell { display: block; max-width: none; }
            .sidebar-view.toc-view .sidebar { position: static; width: 100%; height: auto; padding: .75rem 1rem; overflow: hidden; border-right: 0; border-bottom: 1px solid var(--border); }
            .sidebar-view.toc-view .sidebar-title { margin-bottom: .4rem; padding: 0; }
            .sidebar-view.toc-view .language-switch { width: 12rem; margin: 0 0 .6rem; }
            .sidebar-view.toc-view .sidebar-links { display: flex; padding-bottom: .25rem; overflow-x: auto; scrollbar-width: thin; }
            .sidebar-view.toc-view .sidebar-link { flex: 0 0 auto; white-space: nowrap; }
            .sidebar-view.toc-view .sidebar-group { flex: 0 0 auto; }
            .sidebar-view.toc-view .sidebar-group-links { display: flex; }
            .sidebar-view.toc-view .sidebar-divider { display: none; }
            .table-of-contents { position: static; width: 100%; height: auto; max-height: 16rem; padding: 1rem; border-bottom: 1px solid var(--border); border-left: 0; }
            .toc-title { margin-bottom: .5rem; }
        }
        @media (max-width: 800px) {
            .sidebar-view .page-shell { display: block; }
            .sidebar { position: static; width: 100%; height: auto; padding: .75rem 1rem; overflow: hidden; border-right: 0; border-bottom: 1px solid var(--border); }
            .sidebar-title { margin-bottom: .4rem; padding: 0; }
            .language-switch { width: 12rem; margin: 0 0 .6rem; }
            .sidebar-links { display: flex; padding-bottom: .25rem; overflow-x: auto; scrollbar-width: thin; }
            .sidebar-link { flex: 0 0 auto; white-space: nowrap; }
            .sidebar-group { flex: 0 0 auto; }
            .sidebar-group-links { display: flex; }
            .sidebar-divider { display: none; }
            main.markdown-body { max-width: 100%; overflow-wrap: anywhere; padding: 1.5rem 1rem 3rem; }
            .toolbar-inner { padding-inline: 1rem; }
        }
    </style>
</head>

    <script>

            {

                    ['Lab 00: Preflight', 'azure-ai-infrastructure-workshop/labs/lab-00-preflight/README.md', 'clipboard-check'],

                    ['Lab 06: Ray Serve', 'azure-ai-infrastructure-workshop/labs/lab-06-anyscale-ray-serve/README.md', 'server'],
                    ['Lab 07: Ray Train', 'azure-ai-infrastructure-workshop/labs/lab-07-anyscale-ray-train/README.md', 'brain-circuit'],
                    ['Lab 08: Foundry Compute', 'azure-ai-infrastructure-workshop/labs/lab-08-foundry-managed-compute/README.md', 'cpu'],

            {

                ]
            }
        ];

        const module06Navigation = {
            root: 'agenthost/module-06/',
            title: 'Multi-Agent Business Scenarios resources',
            titleZh: '多智能体业务场景资源',
            links: [
                ['Source and runtime overview', 'agenthost/module-06/agent-src/README.md', 'book-open', '源码与运行概览'],
                ['Chat Agent', 'agenthost/module-06/agent-src/chat_agent/README.md', 'messages-square', '聊天智能体'],
                ['Orchestrator Agent', 'agenthost/module-06/agent-src/orchestrator_agent/README.md', 'workflow', '编排智能体'],
                ['Data Processing Agent', 'agenthost/module-06/agent-src/data_processing_agent/README.md', 'file-input', '数据处理智能体'],
                ['RAG Agent', 'agenthost/module-06/agent-src/rag_agent/README.md', 'search', 'RAG 智能体'],
                ['SQL Agent', 'agenthost/module-06/agent-src/sql_agent/README.md', 'database', 'SQL 智能体']
            ],
            documents: {
                root: 'agenthost/module-06/agent-src/docs/',
                title: 'Design and deployment docs',
                titleZh: '设计与部署文档',
                links: [
                    ['Unified database + ACA deployment', 'agenthost/module-06/agent-src/docs/cli-deployment.md', 'terminal', '统一数据库 + ACA 部署'],
                    ['AKS / ACA deployment', 'agenthost/module-06/agent-src/docs/sandbox-deployment.md', 'container', 'AKS / ACA 部署'],
                    ['Workshop guide', 'agenthost/module-06/agent-src/docs/workshop-guide.md', 'presentation', 'Workshop 操作指南'],
                    ['Architecture', 'agenthost/module-06/agent-src/docs/architecture.md', 'network', '架构'],
                    ['Orchestration', 'agenthost/module-06/agent-src/docs/orchestration.md', 'workflow', '编排'],
                    ['Data processing', 'agenthost/module-06/agent-src/docs/data-processing.md', 'file-input', '数据处理'],
                    ['Security and operations', 'agenthost/module-06/agent-src/docs/security.md', 'shield-check', '安全与运维'],
                    ['Historical implementation report', 'agenthost/module-06/agent-src/docs/implementation-report.md', 'clipboard-check', '历史实现报告']
                ]
            }
        };

        function createSidebarLink(label, path, icon) {
            const link = document.createElement('a');
            link.className = 'sidebar-link';
            link.dataset.file = path;
            link.href = /\.md$/i.test(path)
                ? `markdown-viewer.html?file=${encodeURIComponent(path)}`
                : new URL(path, siteRoot).href;
            link.innerHTML = `<i data-lucide="${icon}"></i><span></span>`;
            link.querySelector('span').textContent = label;
            return link;
        }

        function getAgenthostLanguage() {
            return /_CN\.md$/i.test(file ?? '') ? 'zh-CN' : 'en';
        }

        function getAgenthostPath(path, language) {
            const normalizedPath = path.toLowerCase();
            if (normalizedPath === 'agenthost/readme.md' || normalizedPath === 'agenthost/readme_cn.md') {
                return language === 'zh-CN' ? 'agenthost/README_CN.md' : 'agenthost/readme.md';
            }
            if (/^agenthost\/module-06\/readme(?:_cn)?\.md$/.test(normalizedPath)) {
                return language === 'zh-CN'
                    ? 'agenthost/module-06/readme_CN.md'
                    : 'agenthost/module-06/readme.md';
            }
            if (/^agenthost\/module-06\/agent-src\/readme(?:_cn)?\.md$/.test(normalizedPath)) {
                return language === 'zh-CN'
                    ? 'agenthost/module-06/agent-src/readme_CN.md'
                    : 'agenthost/module-06/agent-src/README.md';
            }
            const documentPath = normalizedPath.replace(/_cn\.md$/, '.md');
            if (documentPath.startsWith('agenthost/module-06/agent-src/docs/') &&
                module06Navigation.documents.links.some(([, target]) => target === documentPath)) {
                return language === 'zh-CN' ? documentPath.replace(/\.md$/, '_CN.md') : documentPath;
            }
            if (normalizedPath.startsWith(module06Navigation.root) &&
                !/\/(?:chat_agent|orchestrator_agent|data_processing_agent|rag_agent|sql_agent)\/readme(?:_cn)?\.md$/.test(normalizedPath)) {
                return path;
            }
            if (language === 'zh-CN') {
                return path.replace(/(?:readme|README)\.md$/i, 'README_CN.md');
            }
            return path.replace(/README_CN\.md$/i, 'README.md');
        }

        function createLanguageSwitch(sidebar, language) {
            if (getAgenthostPath(file, 'en') === getAgenthostPath(file, 'zh-CN')) return;
            const switcher = document.createElement('nav');
            switcher.className = 'language-switch';
            switcher.setAttribute('aria-label', 'Document language');

            [
                ['English', 'en'],
                ['中文', 'zh-CN']
            ].forEach(([label, optionLanguage]) => {
                const option = document.createElement('a');
                option.className = 'language-option';
                option.textContent = label;
                const target = getAgenthostPath(file, optionLanguage);
                option.href = `markdown-viewer.html?file=${encodeURIComponent(target)}`;
                if (optionLanguage === language) {
                    option.setAttribute('aria-current', 'true');
                }
                switcher.append(option);
            });

            sidebar.querySelector('.sidebar-title').after(switcher);
        }

        function markCurrentSidebarLink(links, currentFile = file) {
            const normalizedCurrentFile = currentFile?.toLowerCase();
            const exactMatch = links.find((link) => link.dataset.file.toLowerCase() === normalizedCurrentFile);
            const closestParent = links
                .filter((link) => normalizedCurrentFile?.startsWith(link.dataset.file.toLowerCase().replace(/[^/]+$/, '')))
                .sort((first, second) => second.dataset.file.length - first.dataset.file.length)[0];
            const currentLink = exactMatch ?? closestParent;
            currentLink?.setAttribute('aria-current', 'page');
            return currentLink;
        }

        function revealCurrentSidebarLink(links, currentLink) {
            if (!currentLink || !window.matchMedia('(max-width: 800px)').matches) return;

            window.requestAnimationFrame(() => {
                const linksRect = links.getBoundingClientRect();
                const currentRect = currentLink.getBoundingClientRect();
                links.scrollTo({
                    left: Math.max(0, links.scrollLeft + currentRect.left - linksRect.left - 8),
                    behavior: 'auto'
                });
            });
        }

        function configureSidebar() {
            if (!file) return;
            const section = navigationSections
                .find(({ root }) => file.toLowerCase().startsWith(root.toLowerCase()));
            if (!section) return;

            const sidebar = document.querySelector('.sidebar');
            const links = sidebar.querySelector('.sidebar-links');
            document.body.classList.add('sidebar-view');
            sidebar.hidden = false;
            const language = section.root === 'agenthost/' ? getAgenthostLanguage() : 'en';
            const isChinese = language === 'zh-CN';
            sidebar.querySelector('.sidebar-title').textContent = isChinese ? section.titleZh : section.title;
            if (section.root === 'agenthost/') createLanguageSwitch(sidebar, language);
            const localLinks = section.links.map(([label, path, icon, labelZh]) => {
                const localizedPath = section.root === 'agenthost/' ? getAgenthostPath(path, language) : path;
                return createSidebarLink(isChinese && labelZh ? labelZh : label, localizedPath, icon);
            });
            localLinks.forEach((link) => links.append(link));
            if (file.toLowerCase().startsWith(module06Navigation.root)) {
                const divider = document.createElement('hr');
                divider.className = 'sidebar-divider';
                links.append(divider);
                const title = document.createElement('h2');
                title.className = 'sidebar-title';
                title.textContent = isChinese ? module06Navigation.titleZh : module06Navigation.title;
                links.append(title);
                module06Navigation.links.forEach(([label, path, icon, labelZh]) => {
                    const link = createSidebarLink(isChinese ? labelZh : label, getAgenthostPath(path, language), icon);
                    links.append(link);
                    localLinks.push(link);
                });
                const documents = module06Navigation.documents;
                const group = document.createElement('details');
                group.className = 'sidebar-group';
                group.open = file.toLowerCase().startsWith(documents.root);
                const summary = document.createElement('summary');
                summary.className = 'sidebar-link';
                summary.innerHTML = '<i data-lucide="folder"></i><span></span>';
                summary.querySelector('span').textContent = isChinese ? documents.titleZh : documents.title;
                group.append(summary);
                const documentLinks = document.createElement('div');
                documentLinks.className = 'sidebar-group-links';
                documents.links.forEach(([label, path, icon, labelZh]) => {
                    const link = createSidebarLink(isChinese ? labelZh : label, getAgenthostPath(path, language), icon);
                    documentLinks.append(link);
                    localLinks.push(link);
                });
                group.append(documentLinks);
                links.append(group);
            }
            const currentLink = markCurrentSidebarLink(localLinks);

            const divider = document.createElement('hr');
            divider.className = 'sidebar-divider';
            links.append(divider);

            const repositoryLink = document.createElement('a');
            repositoryLink.className = 'sidebar-link';
            const repositoryFilePath = new URL(file, siteRoot).pathname.slice(siteRoot.pathname.length);
            repositoryLink.href = `${repositoryUrl}/blob/main/${repositoryFilePath}`;
            repositoryLink.target = '_blank';
            repositoryLink.rel = 'noopener noreferrer';
            repositoryLink.innerHTML = `<i data-lucide="github"></i><span>${isChinese ? 'GitHub 仓库' : 'GitHub Repository'}</span>`;
            links.append(repositoryLink);
            window.lucide?.createIcons({ nodes: [sidebar] });
            revealCurrentSidebarLink(links, currentLink);
        }

        configureSidebar();

        function isAllowedMarkdownPath(path) {
            const url = new URL(path, siteRoot);
            return url.origin === siteRoot.origin &&
                url.pathname.startsWith(siteRoot.pathname) &&
                /\.md$/i.test(url.pathname);
        }

        function resolveDocumentLinks(sourceUrl) {
            content.querySelectorAll('a[href], img[src], video[src], source[src]').forEach((element) => {
                const attribute = element.hasAttribute('href') ? 'href' : 'src';
                const value = element.getAttribute(attribute);
                if (!value || value.startsWith('#') || /^(?:data:|mailto:|javascript:)/i.test(value)) return;

                let resolved;
                try {
                    resolved = new URL(value, sourceUrl);
                } catch {
                    return;
                }
                if (attribute === 'href' && resolved.origin === siteRoot.origin &&
                    resolved.pathname === new URL('agenthost/az-toolbox-vm/', siteRoot).pathname) {
                    const readme = file?.toLowerCase().startsWith('agenthost/')
                        ? getAgenthostPath('README.md', getAgenthostLanguage())
                        : 'README.md';
                    resolved = new URL(`${readme}${resolved.search}${resolved.hash}`, resolved);
                }
                if (attribute === 'href' && resolved.origin === siteRoot.origin && /\.md$/i.test(resolved.pathname)) {
                    const markdownPath = decodeURIComponent(resolved.pathname.slice(siteRoot.pathname.length));
                    const viewerUrl = new URL('markdown-viewer.html', siteRoot);
                    viewerUrl.searchParams.set('file', markdownPath);
                    viewerUrl.hash = resolved.hash;
                    element.setAttribute(attribute, viewerUrl.href);
                } else {
                    element.setAttribute(attribute, resolved.href);
                }
            });
        }

        function addHeadingAnchors() {
            const usedIds = new Set(
                [...content.querySelectorAll('[id]')]
                    .map((element) => element.id)
                    .filter(Boolean)
            );
            content.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((heading) => {
                heading.dataset.tocLabel = heading.textContent.trim() || 'Untitled section';
                const baseId = heading.textContent.trim().toLowerCase()
                    .replace(/[^\p{L}\p{N}\s-]/gu, '')
                    .replace(/\s+/g, '-') || 'section';
                let id = baseId;
                let suffix = 1;
                while (usedIds.has(id)) id = `${baseId}-${suffix++}`;
                usedIds.add(id);
                heading.id = id;

                const anchor = document.createElement('a');
                anchor.className = 'heading-anchor';
                anchor.href = `#${id}`;
                anchor.setAttribute('aria-label', `Link to ${heading.textContent}`);
                anchor.textContent = '#';
                heading.prepend(anchor);
            });
        }

        function buildTableOfContents() {
            const headings = [...content.querySelectorAll('h1, h2, h3, h4, h5, h6')];
            if (!headings.length) return;

            const tableOfContents = document.querySelector('.table-of-contents');
            if (getAgenthostLanguage() === 'zh-CN' && file?.toLowerCase().startsWith('agenthost/')) {
                tableOfContents.querySelector('.toc-title').textContent = '本页内容';
            }
            const links = tableOfContents.querySelector('.toc-links');
            headings.forEach((heading) => {
                const link = document.createElement('a');
                link.className = `toc-link toc-level-${heading.tagName.slice(1)}`;
                link.href = `#${encodeURIComponent(heading.id)}`;
                link.textContent = heading.dataset.tocLabel;
                links.append(link);
            });

            const markCurrentHeading = () => {
                const currentId = decodeURIComponent(window.location.hash.slice(1));
                links.querySelectorAll('.toc-link').forEach((link) => {
                    if (decodeURIComponent(link.hash.slice(1)) === currentId && currentId) {
                        link.setAttribute('aria-current', 'location');
                    } else {
                        link.removeAttribute('aria-current');
                    }
                });
            };

            window.addEventListener('hashchange', markCurrentHeading);
            markCurrentHeading();
            document.body.classList.add('toc-view');
            tableOfContents.hidden = false;
        }

        function styleTaskLists() {
            content.querySelectorAll('li > input[type="checkbox"]').forEach((checkbox) => {
                checkbox.parentElement.classList.add('task-list-item');
                checkbox.closest('ul')?.classList.add('contains-task-list');
            });
        }

        function renderAlerts() {
            const alerts = {
                note: { label: 'Note', icon: 'info' },
                tip: { label: 'Tip', icon: 'lightbulb' },
                important: { label: 'Important', icon: 'message-square-warning' },
                warning: { label: 'Warning', icon: 'triangle-alert' },
                caution: { label: 'Caution', icon: 'circle-alert' }
            };

            content.querySelectorAll('blockquote').forEach((blockquote) => {
                const firstParagraph = blockquote.querySelector(':scope > p:first-child');
                if (!firstParagraph) return;
                const marker = firstParagraph.textContent.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i);
                if (!marker) return;

                const type = marker[1].toLowerCase();
                const alert = alerts[type];
                const title = document.createElement('p');
                title.className = 'markdown-alert-title';
                title.innerHTML = window.lucide ? `<i data-lucide="${alert.icon}"></i><span>${alert.label}</span>` : alert.label;
                blockquote.className = `markdown-alert markdown-alert-${type}`;
                firstParagraph.innerHTML = firstParagraph.innerHTML.replace(/^\s*\[!(?:NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i, '');
                blockquote.prepend(title);
                if (!firstParagraph.textContent.trim() && !firstParagraph.children.length) firstParagraph.remove();
            });
        }

        let mermaidDiagramId = 0;

        async function renderMermaidDiagrams() {
            const codeBlocks = [...content.querySelectorAll('pre > code.language-mermaid')];
            if (!codeBlocks.length) return;

            if (!window.mermaid) {
                console.error('Mermaid failed to load. Diagrams will remain as code blocks.');
                return;
            }

            window.mermaid.initialize({
                startOnLoad: false,
                securityLevel: 'strict',
                theme: 'default'
            });

            for (const code of codeBlocks) {
                const source = code.textContent;
                const container = document.createElement('div');
                container.className = 'mermaid-diagram';
                container.setAttribute('role', 'img');
                container.setAttribute('aria-label', 'Mermaid diagram');
                code.parentElement.replaceWith(container);

                try {
                    const id = `mermaid-diagram-${++mermaidDiagramId}`;
                    const { svg, bindFunctions } = await window.mermaid.render(id, source);
                    container.innerHTML = svg;
                    bindFunctions?.(container);
                } catch (error) {
                    console.error('Unable to render Mermaid diagram:', error);
                    container.classList.add('mermaid-error');
                    container.removeAttribute('role');
                    container.removeAttribute('aria-label');
                    container.textContent = `Unable to render Mermaid diagram:\n${error?.message ?? String(error)}`;
                }
            }
        }

        function addCodeCopyButtons() {
            async function copyText(text) {
                try {
                    await navigator.clipboard.writeText(text);
                    return;
                } catch {
                    const source = document.createElement('textarea');
                    source.value = text;
                    source.style.position = 'fixed';
                    source.style.opacity = '0';
                    document.body.append(source);
                    source.select();
                    document.execCommand('copy');
                    source.remove();
                }
            }

            content.querySelectorAll('pre').forEach((pre) => {
                if (pre.querySelector('.copy-code')) return;
                const code = pre.querySelector('code');
                const copyValue = code?.textContent ?? pre.textContent;
                if (code && window.hljs) {
                    const selection = window.getSelection();
                    try {
                        window.hljs.highlightElement(code);
                    } catch {
                        selection?.removeAllRanges();
                    }
                }
                const button = document.createElement('button');
                button.className = 'copy-code';
                button.type = 'button';
                button.title = 'Copy code';
                button.setAttribute('aria-label', 'Copy code');
                button.innerHTML = window.lucide ? '<i data-lucide="copy"></i>' : 'Copy';
                button.addEventListener('click', async () => {
                    await copyText(copyValue);
                    button.title = 'Copied';
                    button.setAttribute('aria-label', 'Copied');
                    button.innerHTML = window.lucide ? '<i data-lucide="check"></i>' : 'Copied';
                    window.lucide?.createIcons({ nodes: [button] });
                    window.setTimeout(() => {
                        button.title = 'Copy code';
                        button.setAttribute('aria-label', 'Copy code');
                        button.innerHTML = window.lucide ? '<i data-lucide="copy"></i>' : 'Copy';
                        window.lucide?.createIcons({ nodes: [button] });
                    }, 1600);
                });
                pre.append(button);
            });
            window.lucide?.createIcons();
        }

        function embedVideos() {
            content.querySelectorAll('a[href]').forEach((link) => {
                let url;
                try {
                    url = new URL(link.href);
                } catch {
                    return;
                }
                const isGitHubAttachment = url.hostname === 'github.com' && url.pathname.startsWith('/user-attachments/assets/');
                const isVideoFile = /\.(?:mp4|webm|ogg)$/i.test(url.pathname);
                if (!isGitHubAttachment && !isVideoFile) return;

                const container = link.closest('p');
                if (!container || container.textContent.trim() !== link.textContent.trim()) return;

                const video = document.createElement('video');
                video.controls = true;
                video.preload = 'metadata';
                video.src = link.href;
                video.textContent = 'Your browser does not support embedded video.';
                container.replaceWith(video);
            });
        }

        async function renderDocument() {
            if (!file || !isAllowedMarkdownPath(file)) {
                throw new Error('Invalid or missing Markdown document path.');
            }

            const sourceUrl = new URL(file, siteRoot);
            documentPath.textContent = file;
            const response = await fetch(sourceUrl);
            if (!response.ok) throw new Error(`Unable to load document (${response.status}).`);

            marked.setOptions({ gfm: true, breaks: false });
            content.innerHTML = marked.parse(await response.text());
            resolveDocumentLinks(sourceUrl);
            await renderMermaidDiagrams();
            embedVideos();
            styleTaskLists();
            renderAlerts();
            const heading = content.querySelector('h1, h2');
            if (heading) document.title = `${heading.textContent} - AI Notes`;
            addHeadingAnchors();
            buildTableOfContents();
            addCodeCopyButtons();

            if (window.location.hash) {
                document.getElementById(decodeURIComponent(window.location.hash.slice(1)))?.scrollIntoView();
            }
        }

        renderDocument().catch((error) => {
            content.replaceChildren();
            const message = document.createElement('p');
            message.className = 'error';
            message.textContent = error.message;
            content.append(message);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Business Analysis Studio</title>
<style>
  :root { --bg:#f3f5ef; --panel:#ffffff; --ink:#17201b; --muted:#667069; --line:#d8ddd7; --accent:#d64f32; --accent-dark:#a93620; --report:#f9faf7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,"Times New Roman",serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  header { height:64px; padding:0 32px; background:var(--ink); color:white; display:flex; align-items:center; border-bottom:4px solid var(--accent); }
  header h1 { font-size:20px; margin:0; font-weight:normal; }
  header .meta { margin-left:auto; font:12px Verdana,sans-serif; color:#cbd2cd; }
  main { width:min(1180px,calc(100% - 32px)); margin:28px auto; display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:24px; }
  .workspace,.report { background:var(--panel); border:1px solid var(--line); border-radius:6px; min-height:calc(100vh - 120px); }
  .workspace { padding:24px; }
  .report { padding:28px 32px; background:var(--report); }
  h2 { margin:0 0 8px; font-size:22px; }
  .intro,.status { color:var(--muted); font:13px/1.5 Verdana,sans-serif; }
  label { display:block; margin:22px 0 7px; font:600 12px Verdana,sans-serif; text-transform:uppercase; }
  textarea { width:100%; resize:vertical; border:1px solid #aeb7b0; border-radius:4px; padding:12px; color:var(--ink); background:white; font:14px/1.5 Consolas,monospace; }
  #requirement { min-height:110px; }
  #businessData { min-height:290px; }
  textarea:focus { outline:2px solid #efb4a7; border-color:var(--accent); }
  button { margin-top:18px; width:100%; height:44px; border:0; border-radius:4px; background:var(--accent); color:white; font:600 14px Verdana,sans-serif; cursor:pointer; }
  button:hover { background:var(--accent-dark); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #output { margin-top:24px; white-space:pre-wrap; overflow-wrap:anywhere; font:15px/1.7 Georgia,serif; }
  .empty { margin-top:80px; text-align:center; color:var(--muted); }
  @media (max-width:800px) { main { grid-template-columns:1fr; } .workspace,.report { min-height:auto; } }
</style>
</head>
<body>
  <header>
    <h1>Business Analysis Studio</h1>
    <span class="meta" id="meta">Connecting</span>
  </header>
  <main>
    <section class="workspace">
      <h2>New analysis</h2>
      <p class="intro">Reader extracts evidence, writer drafts, reviewer critiques, and writer revises.</p>
      <label for="requirement">Analysis requirement</label>
      <textarea id="requirement" placeholder="Example: Compare regional revenue growth and identify the two largest risks."></textarea>
      <label for="businessData">Business data</label>
      <textarea id="businessData" placeholder="Paste CSV, JSON, or plain-text business data."></textarea>
      <button id="run">Run analysis</button>
      <p class="status" id="status"></p>
    </section>
    <section class="report">
      <h2>Final report</h2>
      <div id="output" class="empty">The revised report will appear here.</div>
    </section>
  </main>
<script>
  const meta = document.getElementById('meta');
  const requirement = document.getElementById('requirement');
  const businessData = document.getElementById('businessData');
  const run = document.getElementById('run');
  const status = document.getElementById('status');
  const output = document.getElementById('output');

  async function loadState() {
    try {
      const r = await fetch('/state');
      const s = await r.json();
      meta.textContent = (s.agent_id || 'agent') + ' | ' + (s.history || []).length + ' reports';
      const latest = (s.history || []).at(-1);
      if (latest) { output.textContent = latest.response; output.className = ''; }
    } catch (e) { meta.textContent = 'State unavailable'; }
  }

  async function analyze() {
    if (!requirement.value.trim() || !businessData.value.trim()) {
      status.textContent = 'Both fields are required.';
      return;
    }
    run.disabled = true;
    status.textContent = 'Reader, writer, and reviewer are working...';
    try {
      const r = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requirement: requirement.value, business_data: businessData.value })
      });
      const res = await r.json();
      if (!r.ok) throw new Error(res.error || 'Analysis failed');
      output.textContent = res.final_report;
      output.className = '';
      status.textContent = 'Saved to HorizonDB | Analysis ID: ' + res.analysis_id;
      meta.textContent = res.agent_id;
    } catch (e) { status.textContent = 'Error: ' + e.message; }
    run.disabled = false;
  }

  run.addEventListener('click', analyze);
  loadState();
</script>
</body>
</html>

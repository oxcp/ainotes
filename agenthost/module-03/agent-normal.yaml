# agent-normal.yaml — Module 3 (Solution B): agent runtime on Kubernetes via
# standard Deployment (no kata runtime).
#
# The agent-normal *controller* is installed separately (release manifest — see prepare-agent-sandbox.sh);
# this manifest declares the per-agent runtime as a `Deployment` resource,
# plus the Workload Identity service account and a Service.
#
# Replace acragenthost35153d, latest, agent, and b7d427cc-960f-4060-9717-e0e7d5d4695e before
# applying, or use prepare-agent-sandbox.sh which performs the sed substitution automatically.

# ServiceAccount federated with the Module 1 UAMI (Azure AD Workload Identity)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
  namespace: agent
  annotations:
    azure.workload.identity/client-id: "b7d427cc-960f-4060-9717-e0e7d5d4695e"
  labels:
    azure.workload.identity/use: "true"

---
# Normal Deployment — same container spec as Sandbox, but without kata runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-host-normal
  namespace: agent
  labels:
    app: agent-host-normal
    component: agent-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-host-normal
  template:
    metadata:
      labels:
        app: agent-host-normal
        component: agent-runtime
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: agent-sa
      volumes:
        - name: agent-state
          persistentVolumeClaim:
            claimName: agent-state
      # nodeSelector:
      #   kata-containers: "true"
      # tolerations:
      #   - key: kata
      #     operator: Equal
      #     value: "true"
      #     effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: agent-host-normal
          image: acragenthost35153d.azurecr.io/agent-host:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: agent-state
              mountPath: /app/app/data
          lifecycle:
            preStop:
              exec:
                command: ["/app/lifecycle-hook.sh"]
          env:
            - name: AGENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STATE_MOUNT_PATH
              value: "/app/app/data"
            - name: AGENT_MODE
              value: "foundry"
            - name: FOUNDRY_PROJECT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: agent-config
                  key: foundry-project-endpoint
            - name: FOUNDRY_AGENT_NAME
              value: "agenthost-reflection-agent"
            - name: AGENT_APIM_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: agent-config
                  key: apim-endpoint
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: agent-config
                  key: llm-model
            - name: LLM_TOKEN_SCOPE
              value: "https://ai.azure.com/.default"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: agent-host-normal
  namespace: agent
  labels:
    app: agent-host-normal
spec:
  selector:
    app: agent-host-normal
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

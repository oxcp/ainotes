[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "product-launch-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "pydantic-settings>=2.8,<3", "langgraph>=1.2,<2",
  "psycopg[binary,pool]>=3.3,<4", "pgvector>=0.4,<1",
  "openai>=2.54,<3", "azure-identity>=1.21,<2", "azure-core[aio]>=1.31,<2", "azure-storage-blob>=12.25,<13",
  "sqlglot>=28,<30", "pypdf>=6,<7", "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4", "tiktoken>=0.9,<1", "httpx>=0.28,<1",
  "a2a-sdk[http-server]==1.3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "setuptools>=75"]
sandbox = ["azure-containerapps-sandbox==0.1.0b4"]

[tool.setuptools.packages.find]
include = ["chat_agent*", "orchestrator_agent*", "data_processing_agent*", "rag_agent*", "sql_agent*", "shared*", "migrations*", "deploy*"]

[tool.setuptools.package-data]
chat_agent = ["static/*"]
migrations = ["*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

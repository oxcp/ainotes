<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Notes - Code Reader</title>
    <style>
        :root { color-scheme: light; --ink: #1f2328; --muted: #59636e; --border: #d1d9e0; --link: #0969da; --surface: #ffffff; --canvas: #f6f8fa; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: var(--canvas); font: 14px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        header { position: sticky; top: 0; z-index: 1; padding: .75rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--surface); }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
        a { color: var(--link); }
        .back { font-weight: 600; text-decoration: none; }
        #file-path { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
        fieldset { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin: .6rem 0 0; padding: 0; border: 0; }
        button, select { padding: .35rem .65rem; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
        button { cursor: pointer; }
        button:disabled { cursor: wait; }
        label { display: inline-flex; align-items: center; gap: .4rem; }
        #status { margin: .5rem 0 0; color: var(--muted); overflow-wrap: anywhere; }
        #status.error { color: #cf222e; }
        main { min-height: calc(100vh - 130px); margin: 0 auto; padding: 1rem; background: var(--surface); }
        pre { margin: 0; overflow: auto; font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; tab-size: 4; }
        code { display: block; counter-reset: line; }
        .line { display: block; position: relative; min-height: 1.65em; padding-left: 4.5rem; }
        .line::before { position: absolute; left: 0; width: 3.5rem; padding-right: .75rem; color: var(--muted); text-align: right; border-right: 1px solid var(--border); content: counter(line); counter-increment: line; user-select: none; }
        .wrap code { white-space: pre-wrap; overflow-wrap: anywhere; }
        #json-tree { overflow-wrap: anywhere; font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }
        #json-tree details { margin: .25rem 0; }
        #json-tree summary { cursor: pointer; }
        .json-children { margin-left: 1rem; padding-left: .75rem; border-left: 1px solid var(--border); }
        .json-string { color: #0a3069; }
        .json-number, .json-boolean { color: #0550ae; }
        .json-null { color: var(--muted); }
        a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
        [hidden] { display: none !important; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
        @media (max-width: 600px) { header { padding: .75rem; } main { padding: .75rem .25rem; } }
    </style>
</head>
<body>
    <header>
        <nav class="toolbar" aria-label="Code navigation">
            <a id="back" class="back" href="preview.html">Local preview</a>
            <span id="file-path">Code reader</span>
            <a id="raw" target="_blank" rel="noopener noreferrer" hidden>Open raw</a>
        </nav>
        <fieldset id="controls" disabled>
            <legend class="sr-only">Code display options</legend>
            <button id="copy" type="button">Copy source</button>
            <label><input id="wrap" type="checkbox">Wrap lines</label>
            <label id="json-options" hidden>JSON view
                <select id="json-view">
                    <option value="source">Source</option>
                    <option value="formatted">Formatted</option>
                    <option value="tree">Tree</option>
                </select>
            </label>
        </fieldset>
        <p id="status" role="status" aria-live="polite">Loading file...</p>
    </header>
    <main>
        <pre id="source" tabindex="0" aria-label="Source code"><code id="code"></code></pre>
        <section id="json-tree" aria-label="JSON tree" hidden></section>
    </main>
    <script type="module">
        const languages = new Map([
            ['sh', 'shellscript'], ['ps1', 'powershell'], ['json', 'json'], ['bicep', 'bicep'],
            ['yaml', 'yaml'], ['yml', 'yaml'], ['tf', 'hcl'], ['js', 'javascript'], ['css', 'css'],
            ['dockerfile', 'dockerfile'], ['py', 'python'], ['xml', 'xml'], ['txt', 'text'],
        ]);
        const status = document.getElementById('status');
        const controls = document.getElementById('controls');
        const source = document.getElementById('source');
        const code = document.getElementById('code');
        const tree = document.getElementById('json-tree');
        const jsonView = document.getElementById('json-view');
        let original = '';
        let language;
        let highlighter;
        let renderId = 0;

        function notify(message, error = false) {
            status.className = error ? 'error' : '';
            status.textContent = message;
        }

        function renderLines(lines) {
            const fragment = document.createDocumentFragment();
            lines.forEach((tokens) => {
                const line = document.createElement('span');
                line.className = 'line';
                tokens.forEach((token) => {
                    const span = document.createElement('span');
                    span.textContent = token.content;
                    if (token.color) span.style.color = token.color;
                    line.append(span);
                });
                fragment.append(line);
            });
            code.replaceChildren(fragment);
        }

        function jsonNode(key, value, open = false) {
            if (value === null || typeof value !== 'object') {
                const row = document.createElement('div');
                const primitive = document.createElement('span');
                primitive.className = `json-${value === null ? 'null' : typeof value}`;
                primitive.textContent = JSON.stringify(value);
                row.append(document.createTextNode(`${key}: `), primitive);
                return row;
            }
            const node = document.createElement('details');
            const summary = document.createElement('summary');
            const children = document.createElement('div');
            const entries = Object.entries(value);
            summary.textContent = `${key}: ${Array.isArray(value) ? `[${entries.length} items]` : `{${entries.length} keys}`}`;
            children.className = 'json-children';
            node.append(summary, children);
            let built = false;
            node.addEventListener('toggle', () => {
                if (!node.open || built) return;
                built = true;
                entries.forEach(([name, child]) => {
                    children.append(jsonNode(Array.isArray(value) ? name : JSON.stringify(name), child));
                });
            });
            node.open = open;
            return node;
        }

        async function renderView() {
            const id = ++renderId;
            let text = original;
            let value;
            if (jsonView.value !== 'source') {
                try {
                    value = JSON.parse(original);
                    if (jsonView.value === 'formatted') text = JSON.stringify(value, null, 2);
                } catch (error) {
                    jsonView.value = 'source';
                    source.hidden = false;
                    tree.hidden = true;
                    renderLines(original.split(/\r\n|\n|\r/).map((content) => [{ content }]));
                    notify(`Invalid JSON: ${error.message}. Original source is still available.`, true);
                    return;
                }
            }
            const treeView = jsonView.value === 'tree';
            source.hidden = treeView;
            tree.hidden = !treeView;
            if (treeView) {
                tree.replaceChildren(jsonNode('$', value, true));
                notify('JSON tree. Copy source always copies the original file; display changes do not edit it.');
                return;
            }
            const lines = text.split(/\r\n|\n|\r/);
            renderLines(lines.map((content) => [{ content }]));
            if (language === 'text') {
                notify(`text | ${lines.length} lines. Read-only; Copy source copies the original file.`);
                return;
            }
            notify(`Loading ${language} syntax highlighting...`);
            try {
                highlighter ??= import('https://esm.sh/shiki@4.6.0');
                const { codeToTokens } = await highlighter;
                const { tokens } = await codeToTokens(text, { lang: language, theme: 'github-light' });
                if (id !== renderId) return;
                renderLines(tokens);
                notify(`${language} | ${tokens.length} lines. Read-only; Copy source copies the original file.`);
            } catch (error) {
                if (id !== renderId) return;
                notify(`Syntax highlighting unavailable: ${error.message}. Showing plain source with line numbers.`, true);
            }
        }

        async function loadFile() {
            try {
                const path = new URLSearchParams(location.search).get('file');
                if (!path || !path.split('/').every((part) => part && !part.startsWith('.') &&
                    !/[\\:\u0000-\u001f]/.test(part))) {
                    throw new Error('Specify a visible repository-relative file path using ?file=...');
                }
                const name = path.split('/').pop().toLowerCase();
                language = name === 'dockerfile' ? 'dockerfile' : languages.get(name.split('.').pop());
                if (!language) throw new Error('This file type is not supported by the code reader.');
                const url = new URL(`/${path.split('/').map(encodeURIComponent).join('/')}`, location.href);
                const back = new URL('preview.html', location.href);
                back.searchParams.set('file', path);
                document.getElementById('back').href = back.href;
                document.getElementById('file-path').textContent = path;
                document.title = `${path} - AI Notes`;
                const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(15000) });
                if (!response.ok) throw new Error(`File request failed (${response.status}).`);
                original = await response.text();
                const raw = document.getElementById('raw');
                raw.href = url.href;
                raw.hidden = false;
                controls.disabled = false;
                document.getElementById('json-options').hidden = language !== 'json';
                await renderView();
            } catch (error) {
                notify(`Cannot display file: ${error.message}`, true);
            }
        }

        document.getElementById('copy').addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(original);
                notify('Original source copied.');
            } catch (error) {
                notify(`Copy failed: ${error.message}`, true);
            }
        });
        document.getElementById('wrap').addEventListener('change', (event) => {
            source.classList.toggle('wrap', event.target.checked);
        });
        jsonView.addEventListener('change', renderView);
        loadFile();
    </script>
</body>
</html>

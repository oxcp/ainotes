apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: reflection-agent
  namespace: ${NAMESPACE}
spec:
  podTemplate:
    metadata:
      labels:
        app: reflection-agent
        azure.workload.identity/use: "true"
    spec:
      enableServiceLinks: false
      serviceAccountName: ${SERVICE_ACCOUNT}
      runtimeClassName: kata-vm-isolation-v2
      nodeSelector:
        kubernetes.azure.com/agentpool: ${NODEPOOL_NAME}
      containers:
        - name: agent
          image: ${WORKLOAD_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: AGENT_ID
              value: reflection-agent
            - name: AGENT_APIM_ENDPOINT
              value: ${APIM_GATEWAY_URL}
            - name: LLM_MODEL
              value: ${LLM_MODEL}
            - name: LLM_TOKEN_SCOPE
              value: https://ai.azure.com/.default
            - name: STATE_MOUNT_PATH
              value: /app/app/data
            - name: CHAT_PERSISTENCE_ENABLED
              value: "${CHAT_PERSISTENCE_ENABLED}"
            - name: AGENT_RUN_DEMO
              value: "false"
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/app/lifecycle-hook.sh"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: reflection-agent
  namespace: ${NAMESPACE}
spec:
  selector:
    app: reflection-agent
  ports:
    - port: 8080
      targetPort: 8080

apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: agent-session
  namespace: ${NAMESPACE}
spec:
  podTemplate:
    metadata:
      labels:
        app: agent-session
        azure.workload.identity/use: "true"
    spec:
      enableServiceLinks: false
      serviceAccountName: ${SERVICE_ACCOUNT}
      runtimeClassName: kata-vm-isolation-v2
      nodeSelector:
        kubernetes.azure.com/agentpool: ${NODEPOOL_NAME}
      containers:
        - name: agent
          image: ${WORKLOAD_IMAGE}
          imagePullPolicy: Always
          env:
            - name: AGENT_ID
              value: agent-session
            - name: AGENT_APIM_ENDPOINT
              value: ${APIM_GATEWAY_URL}
            - name: LLM_MODEL
              value: ${LLM_MODEL}
            - name: LLM_TOKEN_SCOPE
              value: https://ai.azure.com/.default
            - name: CHAT_PERSISTENCE_ENABLED
              value: "false"
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "100m"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-session
  namespace: ${NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: agent-session
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-session
  namespace: ${NAMESPACE}
spec:
  parentRefs:
    - name: sandbox-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /agent-session
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: agent-session
          port: 80
    # The claim script copies this rule into a separate Claim-owned HTTPRoute per Service.

